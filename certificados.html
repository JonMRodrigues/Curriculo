<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificados</title>
    <style>
    * { box-sizing: border-box; }

    body {
        font-family: Tahoma, Verdana, Arial, sans-serif;
        margin: 0;
        padding: 30px 12px 60px;
        text-align: center;
        min-height: 100vh;
        background:
            radial-gradient(ellipse 120% 40% at 30% 100%, #4f9a2c 0%, #3d8a1f 55%, transparent 56%),
            radial-gradient(ellipse 100% 35% at 90% 105%, #62b13a 0%, #4a9a26 55%, transparent 56%),
            linear-gradient(#2f6fd6 0%, #6aa8f0 55%, #bfe0ff 100%);
        background-attachment: fixed;
    }

    h1 {
        font-size: 1.5em;
        margin: 0 0 16px;
        padding: 10px 14px;
        color: #0a2a80;
        background: linear-gradient(90deg, #fff 0%, #dce8ff 100%);
        border: 1px solid #7f9db9;
    }

    /* Janela estilo XP */
    .frame {
        position: relative;
        border: 3px solid #0a3fc4;
        border-radius: 9px 9px 4px 4px;
        padding: 48px 18px 18px;
        max-width: 700px;
        margin: auto;
        background-color: #ece9d8;
        box-shadow: 4px 6px 18px rgba(0,0,0,.5);
    }

    .frame::before {
        content: "🎓 Certificados.exe";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        padding: 7px 10px;
        text-align: left;
        color: #fff;
        font-weight: bold;
        font-size: 14px;
        text-shadow: 1px 1px 1px #0a2a80;
        background: linear-gradient(#3a8cff 0%, #0a5be0 12%, #0950d4 50%, #0a4bc8 88%, #0b3fa8 100%);
        border-radius: 6px 6px 0 0;
    }

    .seal {
        background: linear-gradient(#6aa3ff 0%, #2a6ee8 50%, #1352c8 100%);
        color: white;
        padding: 10px 20px;
        font-weight: bold;
        border: 1px solid #0a3fc4;
        border-radius: 8px;
        display: inline-block;
        margin-bottom: 20px;
        font-size: 1.1em;
    }

    .carousel {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin: auto;
        padding: 6px;
        background: #fff;
        border: 1px solid #919b9c;
        border-radius: 4px;
    }

    .carousel img {
        width: 100%;
        display: none;
        border: 2px solid #7f9db9;
        border-radius: 3px;
    }

    .carousel img.active {
        display: block;
    }

    .buttons {
        margin-top: 12px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    button, .btn-voltar {
        padding: 10px 20px;
        cursor: pointer;
        font: bold 14px Tahoma, Verdana, Arial, sans-serif;
        color: #fff;
        text-shadow: 1px 1px 1px #0a2a80;
        background: linear-gradient(#6aa3ff 0%, #2a6ee8 50%, #1352c8 100%);
        border: 1px solid #0a3fc4;
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
        text-decoration: none;
        flex: 1 1 auto;
        min-width: 120px;
    }

    .btn-voltar {
        display: block;
        text-align: center;
        color: #fff;
        text-shadow: 1px 1px 1px #145a0a;
        border-color: #1a6b0e;
        background: linear-gradient(#6fd45a 0%, #3ea82b 50%, #2d8f1c 100%);
    }

    button:hover, .btn-voltar:hover {
        filter: brightness(1.1);
    }

    button:active, .btn-voltar:active {
        filter: brightness(.92);
    }

    .voltar {
        margin-top: 14px;
    }

    /* Responsividade */
    @media (max-width: 768px) {
        h1 {
            font-size: 1.3em;
        }

        .frame {
            padding: 46px 12px 14px;
        }

        .seal {
            font-size: 1em;
            padding: 8px 16px;
        }

        button, .btn-voltar {
            font-size: 0.9em;
            padding: 8px 16px;
        }
    }

    @media (max-width: 480px) {
        .buttons {
            flex-direction: column;
        }

        button, .btn-voltar {
            width: 100%;
        }
    }
</style>

</head>
<body>
    <div class="frame">
        <h1>Meus Certificados</h1>
        <div class="carousel">
            <img src="cert1.jpg" alt="Certificado 1" class="active">
            <img src="cert2.jpg" alt="Certificado 2">
            <img src="cert3.jpg" alt="Certificado 3">
            <img src="cert4.png" alt="Certificado 4">
            <img src="cert5.png" alt="Certificado 5">
            <img src="cert6.png" alt="Certificado 6">
            <img src="cert7.png" alt="Certificado 7">
            <img src="cert8.png" alt="Certificado 8">
            <img src="cert9.png" alt="Certificado 9">
            <img src="CertificadoIntelbras.png" alt="Certificado 10">
            <img src="CertificadoIntelbras2.png" alt="Certificado 11">
        </div>
        <div class="buttons">
            <button onclick="prevImage()">◀ Anterior</button>
            <button onclick="nextImage()">Próximo ▶</button>
        </div>
        <div class="voltar">
            <a href="index.html" class="btn-voltar">⬅ Voltar ao Currículo</a>
        </div>
    </div>
    <script>
        let currentIndex = 0;
        const images = document.querySelectorAll('.carousel img');
    
        function showImage(index) {
            if (index < 0) index = images.length - 1;
            if (index >= images.length) index = 0;
            currentIndex = index;
            images.forEach((img, i) => {
                img.classList.remove('active');
                if (i === currentIndex) img.classList.add('active');
            });
        }
    
        function prevImage() {
            showImage(currentIndex - 1);
        }
    
        function nextImage() {
            showImage(currentIndex + 1);
        }
    
        // 🔄 Carrossel automático a cada 4 segundos
        setInterval(() => {
            nextImage();
        }, 4000);
    </script>
</body>
</html>
